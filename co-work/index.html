<title>KMOP Co-Work</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed project rail on the left (projects by acronym, grouped by
   status), the working surface on the right. Codes and months set in mono,
   because "D2.1 · M10" is how an EU project talks. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --sunk: #eaeef4; --ink: #142033; --muted: #5a677a; --line: #d9dfe8;
  --accent: #1f4aa8; --accent-ink: #ffffff; --accent-soft: #e5ecfa; --gold: #c99a0e;
  --red: #c23b3b; --red-soft: #fbe9e9; --amber: #b87a07; --amber-soft: #fbf1dc; --green: #2b8a57; --green-soft: #e3f3ea; --grey: #8a95a5;
  --bar-base: #cdd6e4; --bar-plan-line: #8d9ab0;
  --f-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1520; --surface: #172030; --sunk: #1d283a; --ink: #e4e9f1; --muted: #9aa6b8; --line: #2a374c;
  --accent: #7ea2f2; --accent-ink: #0d1626; --accent-soft: #22325a; --gold: #e3bb45;
  --red: #ef7b7b; --red-soft: #3a2024; --amber: #e2ad4a; --amber-soft: #3a2f18; --green: #5cc58f; --green-soft: #18352a; --grey: #7c889a;
  --bar-base: #34425a; --bar-plan-line: #6c7b94; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1520; --surface: #172030; --sunk: #1d283a; --ink: #e4e9f1; --muted: #9aa6b8; --line: #2a374c;
  --accent: #7ea2f2; --accent-ink: #0d1626; --accent-soft: #22325a; --gold: #e3bb45;
  --red: #ef7b7b; --red-soft: #3a2024; --amber: #e2ad4a; --amber-soft: #3a2f18; --green: #5cc58f; --green-soft: #18352a; --grey: #7c889a;
  --bar-base: #34425a; --bar-plan-line: #6c7b94; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 0.92em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100%; }
/* ---------- rail */
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: max(0px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand b { font-size: 15px; letter-spacing: .01em; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; }
.topnav { display: grid; gap: 2px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.navbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: var(--r); cursor: pointer; }
.navbtn:hover { background: var(--sunk); }
.navbtn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navbtn .later { font-size: 10.5px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.railtools { padding: 10px 12px 6px; display: grid; gap: 6px; }
.railtools input, .railtools select { width: 100%; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.plist { overflow-y: auto; padding: 4px 8px 16px; flex: 1; min-height: 0; }
.pgroup { margin-top: 10px; }
.pgroup h4 { margin: 0; padding: 4px 10px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pitem { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border-radius: var(--r); cursor: pointer; }
.pitem:hover { background: var(--sunk); }
.pitem.on { background: var(--accent-soft); }
.pitem .acr { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin { border: 0; background: none; cursor: pointer; padding: 0 2px; color: var(--muted); font-size: 13px; }
.pin.on { color: var(--gold); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--grey); flex: none; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); }
.count { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--red-soft); color: var(--red); }
.badge { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.coo { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge.wp { border-color: var(--gold); color: var(--gold); }
/* ---------- main */
.main { overflow-y: auto; min-width: 0; }
.wrap { padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; }
@media (min-width: 900px) { .wrap { padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.mobilebar { display: none; }
.phead { display: grid; gap: 8px; padding-bottom: 14px; }
.phead .row1 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.phead h1 { font-size: 26px; letter-spacing: -.01em; }
.phead .full { color: var(--muted); max-width: 72ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.facts span b { font-weight: 600; }
.mpill { font-family: var(--f-mono); font-size: 12.5px; padding: 3px 8px; border-radius: 4px; background: var(--ink); color: var(--bg); }
.ragpill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 12px; font-size: 12.5px; font-weight: 600; background: var(--sunk); }
.ragpill.red { background: var(--red-soft); color: var(--red); } .ragpill.amber { background: var(--amber-soft); color: var(--amber); } .ragpill.green { background: var(--green-soft); color: var(--green); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 18px; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 9px 12px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .later { font-size: 10px; margin-left: 4px; opacity: .7; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.panel > h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stack { display: grid; gap: 18px; }
.urgent { display: grid; gap: 0; }
.uitem { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.uitem:first-child { border-top: 0; }
.stripe { align-self: stretch; border-radius: 2px; background: var(--grey); }
.stripe.red { background: var(--red); } .stripe.amber { background: var(--amber); } .stripe.blue { background: var(--accent); }
.uitem .t { font-weight: 500; }
.uitem .s { font-size: 12.5px; color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; border-radius: var(--r); cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=search], input[type=date], input[type=number], input[type=url], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunk); }
.status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--sunk); white-space: nowrap; }
.status.done { background: var(--green-soft); color: var(--green); }
.status.doing { background: var(--accent-soft); color: var(--accent); }
.status.blocked, .status.late { background: var(--red-soft); color: var(--red); }
.status.warn { background: var(--amber-soft); color: var(--amber); }
.slip { font-family: var(--f-mono); font-size: 11.5px; color: var(--red); white-space: nowrap; }
.conf { color: var(--amber); font-weight: 700; cursor: help; }
.kpi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.kpi:first-child { border-top: 0; }
.meter { grid-column: 1 / -1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.list { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.notice { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.later-card { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 22px; max-width: 68ch; }
.later-card h2 { font-size: 18px; margin-bottom: 8px; }
/* gantt */
.gantt { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gantt svg { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 8px 0 12px; align-items: center; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--sunk); border-radius: 8px; padding: 10px; min-height: 160px; }
.col h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.col.drop { outline: 2px dashed var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: grab; display: grid; gap: 4px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.cal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 92px; padding: 4px; background: var(--surface); min-width: 0; }
.cal .dow { min-height: 0; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; background: var(--sunk); }
.cal .out { background: var(--sunk); opacity: .6; }
.cal .num { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.cal .today .num { color: var(--accent); font-weight: 700; }
.cal .ev { display: block; width: 100%; text-align: left; border: 0; font-size: 11.5px; padding: 2px 5px; margin-top: 3px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal .ev.partner { background: var(--sunk); border: 1px dashed var(--line); }
.cal .ev.late { background: var(--red-soft); }
@media (max-width: 700px) { .cal > div { min-height: 64px; } .cal .ev { font-size: 10.5px; } }
/* drawer */
.scrim { position: fixed; inset: 0; background: rgb(10 16 28 / .38); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; border-left: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer .body { overflow-y: auto; padding: 14px 16px 30px; display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field > label, .field > .lbl { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.fields2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .fields2 { grid-template-columns: 1fr; } }
.picker { position: relative; }
.picks { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-top: 2px; max-height: 220px; overflow-y: auto; }
.picks button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; cursor: pointer; }
.picks button:hover { background: var(--sunk); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 12px; background: var(--sunk); font-size: 12.5px; }
.comment { border-top: 1px solid var(--line); padding-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 30; font-size: 13px; }
.confirmbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--red-soft); padding: 8px 10px; border-radius: 6px; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 22; transform: translateX(-102%); transition: transform .18s; padding-top: env(safe-area-inset-top, 0px); }
  .rail.open { transform: none; box-shadow: 0 0 40px rgb(0 0 0 / .25); }
  .mobilebar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .phead h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>

<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main" id="main">
    <div class="mobilebar"><button class="btn" data-act="rail">☰ Projects</button><b>KMOP Co-Work</b></div>
    <div class="wrap" id="view"><div class="empty">Loading KMOP Co-Work…</div></div>
  </main>
</div>
<div id="overlay"></div>

<script>
'use strict';
// ============================================================ vocabulary
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DSTATUS = { not_started: 'Not started', drafting: 'Drafting', internal_review: 'Internal review', validated: 'Validated', submitted: 'Submitted to EC', accepted: 'Accepted', revision: 'Revision requested' };
const DSTATUS_ORDER = ['not_started','drafting','internal_review','validated','submitted','accepted','revision'];
const DDONE = new Set(['submitted','accepted']);
const MSTATUS = { planned: 'Planned', at_risk: 'At risk', achieved: 'Achieved' };
const TSTATUS = { todo: 'To do', doing: 'In progress', blocked: 'Blocked', done: 'Done' };
const WPTSTATUS = { not_started: 'Not started', doing: 'In progress', done: 'Done' };
const ROLE_BADGE = { COORDINATOR: ['COO','coo'], WP_LEAD: ['WP lead','wp'], TASK_LEAD: ['Task lead',''], PARTNER: ['Partner',''] };
const PSTATUS = [['implementation','Under implementation'],['soon','Soon to start'],['closing','Closing'],['completed','Completed']];
const APP_ROLES = { admin: 'Admin', smt: 'Senior management', hou: 'Head of unit', pm: 'PM / Researcher', finance: 'Finance', viewer: 'Viewer' };
const TABS = [
  ['overview','Overview'], ['plan','Plan'], ['work','Work'], ['deliverables','Deliverables & milestones'],
  ['meetings','Meetings & actions'], ['kpis','KPIs'], ['risks','Risks'], ['partners','Partners'],
  ['inbox','Inbox'], ['documents','Documents'], ['activity','Activity'],
];

// ============================================================ state
const S = {
  db: null, user: null, me: null, myId: null, canWrite: true, isAdmin: false, isOwner: false, noDb: false, ready: {},
  projects: [], dels: [], mss: [], tasks: [], conflicts: [], handled: [], overrides: [], kpiv: [], members: [], activity: [], drafts: [], sugg: [], meetings: [], risks: [], runs: [], statusReports: [], prefs: null, emails: [], settings: [],
  names: {}, pins: [], prefsVersion: 0,
  route: parseHash(), railOpen: false,
  ui: { q: '', fProg: '', fEnt: '', fPm: '', fRole: '', work: 'list', wOwner: 'all', wStatus: 'open', wWp: '', wq: '', calMonth: null, baseline: {}, dFilter: '', drawer: null, picks: null, confirm: null, mwFilter: 'mine' },
};
function parseHash() {
  const h = (location.hash || '').slice(1);
  const m = h.match(/^p\.([a-z0-9-]+)(?:\.([a-z]+))?$/);
  if (m) return { view: 'project', id: m[1], tab: m[2] || 'overview' };
  if (['mywork','portfolio','teamportfolio','notifications','mailbox','procedures','reports','team'].includes(h)) return { view: h };
  return { view: 'home' };
}
function go(route) {
  S.route = route; S.railOpen = false;
  const h = route.view === 'project' ? `p.${route.id}.${route.tab || 'overview'}` : route.view === 'home' ? '' : route.view;
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch {}
  render(); document.getElementById('main').scrollTop = 0;
}
window.addEventListener('hashchange', () => { S.route = parseHash(); render(); });

// ============================================================ helpers
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); };
const iso = (d) => d.toISOString().slice(0, 10);
const parseDay = (s) => s ? new Date(s + 'T00:00:00Z') : null;
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const fmtDay = (s) => { const d = parseDay(s); return d ? `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}` : ''; };
const nowIso = () => new Date().toISOString();

// Months, not dates: M1 is the project's start month.
function ym(start) { const [y, m] = start.split('-').map(Number); return { y, m }; }
function monthOf(p, date) { const s = ym(p.start_month); return (date.getUTCFullYear() - s.y) * 12 + (date.getUTCMonth() + 1 - s.m) + 1; }
function mYM(p, M) { const s = ym(p.start_month); const t = (s.m - 1) + (M - 1); return { y: s.y + Math.floor(t / 12), m: ((t % 12) + 12) % 12 + 1 }; }
function mLabel(p, M) { if (M == null) return ''; const { y, m } = mYM(p, M); return `${MON[m - 1]} ${y}`; }
function mEnd(p, M) { const { y, m } = mYM(p, M); return new Date(Date.UTC(y, m, 0)); }
function mStart(p, M) { const { y, m } = mYM(p, M); return new Date(Date.UTC(y, m - 1, 1)); }
const curM = (p) => monthOf(p, today());
const endDate = (p) => mEnd(p, p.duration);

const proj = (id) => S.projects.find(p => p.id === id);
const baselineOf = (p) => S.ui.baseline[p.id] || p.active_baseline || 'v1';
const dueM = (p, x, v) => { const d = x.due || {}; return d[v || baselineOf(p)] ?? d[p.active_baseline] ?? d.v1 ?? null; };
const pDels = (pid) => S.dels.filter(d => d.project === pid).sort((a, b) => codeSort(a.code, b.code));
const pMss = (pid) => S.mss.filter(d => d.project === pid).sort((a, b) => codeSort(a.code, b.code));
const pTasks = (pid) => S.tasks.filter(t => t.project === pid);
const pConf = (pid) => S.conflicts.filter(c => c.project === pid && c.status === 'open');
function codeSort(a, b) { const na = String(a).match(/\d+/g) || [], nb = String(b).match(/\d+/g) || []; for (let i = 0; i < Math.max(na.length, nb.length); i++) { const d = (+na[i] || 0) - (+nb[i] || 0); if (d) return d; } return String(a).localeCompare(String(b)); }
const conflictOn = (pid, obj) => S.conflicts.filter(c => c.project === pid && c.status === 'open' && c.object === obj);
function confMark(pid, obj) { const c = conflictOn(pid, obj); return c.length ? ` <span class="conf" title="${esc(c.map(x => x.field + ': ' + x.reason).join('\n'))}">(!)</span>` : ''; }

// ============================================================ RAG + urgent (rules from the brief, configurable later)
function delState(p, d) {
  const due = dueM(p, d); const done = DDONE.has(d.status);
  if (due == null || done) return { done, overdue: false, days: null };
  const days = daysBetween(today(), mEnd(p, due));
  return { done, overdue: days < 0, days };
}
function msState(p, m) {
  const due = dueM(p, m); const done = m.status === 'achieved';
  if (due == null || done || m.status == null) return { done, overdue: false, days: due == null ? null : daysBetween(today(), mEnd(p, due)), unknown: m.status == null };
  const days = daysBetween(today(), mEnd(p, due));
  return { done, overdue: days < 0, days };
}
const taskOverdue = (t) => t.status !== 'done' && t.due && parseDay(t.due) < today();
function slipOf(p, x) { const due = dueM(p, x); return (x.forecast_month != null && due != null) ? x.forecast_month - due : 0; }
function ragOf(p) {
  const red = [], amber = [];
  for (const d of pDels(p.id)) {
    const s = delState(p, d);
    if (s.overdue) red.push(`${d.code} overdue (due M${dueM(p, d)})`);
    else if (!s.done && s.days != null && s.days <= 14 && d.status === 'not_started') red.push(`${d.code} due in ${s.days} days and not started`);
    else if (!s.done && s.days != null && s.days <= 30 && d.status === 'drafting') amber.push(`${d.code} due in ${s.days} days, still drafting`);
    if (slipOf(p, d) > 1) amber.push(`${d.code} slipped ${slipOf(p, d)} months`);
  }
  for (const m of pMss(p.id)) {
    const s = msState(p, m);
    if (s.overdue) red.push(`${m.code} overdue (due M${dueM(p, m)})`);
    if (slipOf(p, m) > 1) amber.push(`${m.code} slipped ${slipOf(p, m)} months`);
  }
  for (const wp of p.wps || []) for (const t of wp.tasks || []) {
    const fe = t.forecast_end ?? t.actual_end; if (fe != null && t.end != null && fe - t.end > 1) amber.push(`${t.code} slipped ${fe - t.end} months`);
  }
  for (const t of pTasks(p.id)) if (t.coordinator_blocker && t.status !== 'done' && t.since && daysBetween(parseDay(t.since), today()) > 30) red.push(`Coordinator blocker open ${daysBetween(parseDay(t.since), today())} days: ${t.title}`);
  const od = pTasks(p.id).filter(taskOverdue).length; if (od >= 3) amber.push(`${od} overdue actions`);
  const computed = red.length ? 'red' : amber.length ? 'amber' : 'green';
  const ov = S.overrides.find(o => o.id === p.id && o.rag);
  return { rag: ov ? ov.rag : computed, computed, reasons: red.length ? red : amber, red, amber, override: ov || null };
}
function overdueCount(p) {
  return pDels(p.id).filter(d => delState(p, d).overdue).length + pMss(p.id).filter(m => msState(p, m).overdue).length + pTasks(p.id).filter(taskOverdue).length;
}
function urgentItems(p) {
  const out = [], hk = handledKeys();
  const add = (o) => { if (!hk.has(o.key)) out.push(o); };
  for (const d of pDels(p.id)) {
    const s = delState(p, d), due = dueM(p, d);
    if (s.overdue) add({ key: `del:${d.code}:overdue:M${due}`, sev: 'red', t: `${d.code} ${d.title} is overdue`, s: `Due M${due} · ${mLabel(p, due)} · ${DSTATUS[d.status] || 'status not recorded'}${p.funding_model === 'lump_sum' ? ' · lump sum: payment risk' : ''}`, del: d.code });
    else if (!s.done && s.days != null && s.days <= 14) add({ key: `del:${d.code}:14:M${due}`, sev: d.status === 'not_started' ? 'red' : 'amber', t: `${d.code} due in ${s.days} days`, s: `${d.title} · ${DSTATUS[d.status] || 'status not recorded'}`, del: d.code });
    else if (!s.done && s.days != null && s.days <= 30 && ['not_started','drafting'].includes(d.status)) add({ key: `del:${d.code}:30:M${due}`, sev: 'amber', t: `${d.code} due in ${s.days} days, ${DSTATUS[d.status].toLowerCase()}`, s: d.title, del: d.code });
  }
  for (const m of pMss(p.id)) {
    const s = msState(p, m), due = dueM(p, m);
    if (s.overdue) add({ key: `ms:${m.code}:overdue`, sev: 'red', t: `${m.code} ${m.title} is past due`, s: `Due M${due} · ${mLabel(p, due)}` });
    else if (m.status === 'at_risk') add({ key: `ms:${m.code}:risk`, sev: 'amber', t: `${m.code} ${m.title} at risk`, s: m.note || `Due M${due}` });
    else if (s.unknown && due != null && due <= curM(p)) add({ key: `ms:${m.code}:unknown`, sev: 'blue', t: `${m.code} ${m.title}: status not recorded`, s: `Due M${due}. Record whether it was achieved.` });
  }
  for (const t of pTasks(p.id)) {
    if (t.status === 'done') continue;
    if (t.coordinator_blocker) add({ key: `task:${t.id}:blocker`, sev: 'red', t: t.title, s: `Coordinator item${t.since ? ` · open since ${fmtDay(t.since)}` : ''}${t.status === 'blocked' ? ' · blocked' : ''}`, task: t.id });
    else if (t.status === 'blocked') add({ key: `task:${t.id}:blocked`, sev: 'amber', t: t.title, s: 'Blocked', task: t.id });
    else if (taskOverdue(t)) add({ key: `task:${t.id}:overdue:${t.due}`, sev: 'red', t: t.title, s: `Overdue since ${fmtDay(t.due)} · ${t.owner_kind === 'partner' ? (t.owner_partner || 'partner') : (nameOf(t.owner_user) || 'KMOP, unassigned')}`, task: t.id });
    else if (t.due && daysBetween(today(), parseDay(t.due)) <= 14) add({ key: `task:${t.id}:soon:${t.due}`, sev: 'amber', t: t.title, s: `Due ${fmtDay(t.due)}`, task: t.id });
  }
  for (const a of meetingAlerts(p)) add(a);
  for (const c of computedConflicts(p)) add({ key: c.key, sev: 'blue', t: `Sources disagree: ${c.object} · ${c.field}`, s: c.reason, ...(c.task ? { task: c.task } : {}) });
  for (const c of pConf(p.id)) add({ key: `conf:${c.id}`, sev: 'blue', t: `Sources disagree: ${c.object} · ${c.field}`, s: c.reason, conf: c.id });
  const rank = { red: 0, amber: 1, blue: 2 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

// ============================================================ data access
function sub(name, key, q) {
  const ref = q ? q(S.db.collection(name)) : S.db.collection(name);
  ref.onSnapshot(snap => { S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready[key] = true; afterData(key); scheduleRender(); },
    e => { console.warn(name, e.code); S.ready[key] = true; if (e.code === 'revoked') S.noDb = true; scheduleRender(); });
}
let nameReq = null;
function afterData(key) {
  if (key !== 'tasks' && key !== 'members' && key !== 'activity') return;
  clearTimeout(nameReq); nameReq = setTimeout(resolveNames, 60);
}
async function resolveNames() {
  if (!S.user) return;
  const ids = new Set();
  for (const t of S.tasks) { if (t.owner_user) ids.add(t.owner_user); (t.watchers || []).forEach(w => ids.add(w)); }
  for (const m of S.members) ids.add(m.id);
  for (const a of S.activity) if (a.by) ids.add(a.by);
  const list = [...ids].filter(id => id && !(id in S.names));
  if (!list.length) return;
  try { const ps = await S.user.profiles(list); for (const id of list) S.names[id] = ps[id]?.name || 'Someone'; scheduleRender(); } catch {}
}
let toastT;
function toast(msg) { const o = document.getElementById('toastbox') || Object.assign(document.body.appendChild(document.createElement('div')), { id: 'toastbox' }); o.className = 'toast'; o.textContent = msg; o.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { o.hidden = true; }, 2600); }
async function write(fn, okMsg) {
  if (!S.db) { toast('Open KMOP Co-Work in Claude to make changes.'); return false; }
  if (!canEdit()) { toast('You can view this page but not change it. Ask the owner for Contributor access.'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e?.code === 'invalid_argument') { S.canWrite = false; toast('This change was refused: you have view-only access.'); render(); }
    else if (e?.code === 'quota_exceeded') toast('The store is full. Delete old items and try again.');
    else if (e?.code === 'no_target') toast(e.message);
    else toast('Could not save. Check your connection and try again.');
    return false;
  }
}
function log(project, text) { if (!S.db) return; S.db.collection('activity').add({ project, text, by: S.myId, at: nowIso(), source: 'human' }).catch(() => {}); }
const writeQueues = {};
function queued(path, fn) { const prev = writeQueues[path] || Promise.resolve(); const next = prev.then(fn, fn); writeQueues[path] = next.catch(() => {}); return next; }
function patch(coll, id, data, logText, project) {
  return write(() => queued(`${coll}/${id}`, () => S.db.collection(coll).doc(id).update({ ...data, updated_at: nowIso(), updated_by: S.myId })).then(() => { if (logText) log(project, logText); }));

  const lim = 30;
  for (const d of pDels(p.id)) { const s = delState(p, d); if (!s.done && s.days != null && s.days >= 0 && s.days <= lim) next.push({ when: iso(mEnd(p, dueM(p, d))), what: `${d.code} ${d.title}`, kind: 'Deliverable', sub: `M${dueM(p, d)} · ${DSTATUS[d.status] || 'not recorded'}` }); }
  for (const m of pMss(p.id)) { const s = msState(p, m); if (!s.done && s.days != null && s.days >= 0 && s.days <= lim) next.push({ when: iso(mEnd(p, dueM(p, m))), what: `${m.code} ${m.title}`, kind: 'Milestone', sub: `M${dueM(p, m)}` }); }
  for (const t of pTasks(p.id)) if (t.status !== 'done' && t.due) { const dd = daysBetween(today(), parseDay(t.due)); if (dd >= 0 && dd <= lim) next.push({ when: t.due, what: t.title, kind: 'Task', sub: t.owner_kind === 'partner' ? t.owner_partner || 'Partner' : nameOf(t.owner_user) || 'KMOP', task: t.id }); }
  next.sort((a, b) => a.when.localeCompare(b.when));
  const kv = (k) => S.kpiv.find(x => x.id === `${p.id}__${k.id}`);
  return `<div class="grid2">
    <div class="stack">
      ${draftsFor(p.id).filter(d => d.status === 'draft').map(d => `<div class="notice"><b>A draft baseline is waiting for review</b> (${esc(d.baseline_label || 'from onboarding')}). <button class="btn small primary" data-act="review" data-id="${esc(d.id)}">Review</button></div>`).join('')}
      <div class="panel"><h3>Needs attention <span class="small" style="text-transform:none;letter-spacing:0">${u.length} items</span></h3>${renderUrgentList(p, u)}</div>
      ${renderConflicts(p)}
      ${openSugg(p.id).length ? `<div class="panel"><h3>Agent suggestions to review · ${openSugg(p.id).length} <button class="btn small" data-act="tab" data-tab="meetings">Review all</button></h3><div class="urgent">${openSugg(p.id).slice(0, 4).map(renderSuggestion).join('')}</div></div>` : ''}
      <div class="panel"><h3>Plan vs actual <button class="btn small" data-act="tab" data-tab="plan">Open plan</button></h3>${gantt(p, { compact: true })}</div>
    </div>
    <div class="stack">
      ${renderStatusCard(p)}
      <div class="panel"><h3>RAG</h3>
        <div class="row" style="margin-bottom:8px"><span class="ragpill ${rg.rag}"><span class="dot ${rg.rag}"></span>${rg.rag.toUpperCase()}</span>
        ${rg.override ? `<span class="small muted">Override by ${esc(nameOf(rg.override.by) || 'PM')}: “${esc(rg.override.reason)}” (rules say ${rg.computed})</span>` : `<span class="small muted">From the RAG rules</span>`}</div>
        ${rg.reasons.length ? `<ul class="list small">${rg.reasons.slice(0, 6).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        <div class="row" style="margin-top:10px">${renderOverride(p, rg)}</div>
        <p class="small muted" style="margin:14px 0 6px"><b>Notes from the seed</b> (minutes, handover, trackers)</p>
        <ul class="list small">${(p.status_notes || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      </div>
      <div class="panel"><h3>Next 30 days</h3>${next.length ? next.map(n => `<div class="kpi"><div><div>${esc(n.what)}</div><div class="small muted">${n.kind} · ${esc(n.sub)}</div></div><div class="mono small">${fmtDay(n.when)}</div></div>`).join('') : '<div class="empty small">Nothing due in the next 30 days.</div>'}</div>
      <div class="panel"><h3>KPI snapshot <button class="btn small" data-act="tab" data-tab="kpis">All KPIs</button></h3>${(p.kpis || []).slice(0, 5).map(k => { const v = kv(k)?.current ?? k.current; const pct = v != null && k.target ? Math.min(100, Math.round(v / k.target * 100)) : 0; return `<div class="kpi"><div class="small">${esc(k.label)}${k.conflict ? confMark(p.id, 'KPI') : ''}</div><div class="mono small">${v ?? '—'} / ${k.op || ''}${k.target}${k.target_max ? '–' + k.target_max : ''} ${esc(k.unit)}</div><div class="meter"><i style="width:${pct}%"></i></div></div>`; }).join('')}</div>
      ${(p.unconfirmed || []).length ? `<div class="panel"><h3>To confirm</h3><ul class="list small">${p.unconfirmed.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    </div></div>`;
}
function renderOverride(p, rg) {
  if (!canEdit()) return '';
  if (S.ui.overrideFor === p.id) return `<select id="ov-rag"><option value="">Use the rules</option>${['green','amber','red'].map(x => `<option value="${x}" ${rg.override?.rag === x ? 'selected' : ''}>${x.toUpperCase()}</option>`).join('')}</select><input type="text" id="ov-reason" placeholder="Reason (required)" value="${esc(rg.override?.reason || '')}" style="flex:1"><button class="btn small primary" data-act="ov-save" data-pid="${esc(p.id)}">Save</button><button class="btn small" data-act="ov-cancel">Cancel</button>`;
  return `<button class="btn small" data-act="ov-open" data-pid="${esc(p.id)}">${rg.override ? 'Change override' : 'Override RAG'}</button>`;
}

// ------------------------------------------------------------ gantt (baseline vs forecast vs actual)
function gantt(p, o = {}) {
  const v = baselineOf(p), cm = curM(p), N = p.duration;
  const colW = o.compact ? 14 : 24, labW = o.compact ? 170 : 290, rowH = o.compact ? 22 : 26, headH = 34;
  const rows = [];
  for (const wp of p.wps || []) {
    const wpDels = pDels(p.id).filter(d => d.wp === wp.code), wpMs = pMss(p.id).filter(m => m.wp === wp.code);
    const items = [];
    for (const t of wp.tasks || []) items.push({ kind: 't', x: t });
    for (const d of wpDels) items.push({ kind: 'd', x: d });
    for (const m of wpMs) items.push({ kind: 'm', x: m });
    const show = o.compact ? items.filter(it => it.kind === 't' ? ((it.x.forecast_end ?? it.x.end) !== it.x.end || it.x.status === 'not_started' && it.x.start != null && it.x.start <= cm) : it.kind === 'd' ? (slipOf(p, it.x) || delState(p, it.x).overdue || (it.x.status !== 'accepted' && it.x.status !== 'submitted' && dueM(p, it.x) <= cm + 3)) : (msState(p, it.x).overdue || it.x.status === 'at_risk' || slipOf(p, it.x) || (it.x.status === 'achieved' && it.x.achieved_month != null && it.x.achieved_month !== dueM(p, it.x)))) : items;
    if (o.compact && !show.length) continue;
    rows.push({ kind: 'wp', x: wp });
    rows.push(...show);
  }
  if (!rows.length) return '<div class="empty small">Nothing slipped or at risk.</div>';
  const W = labW + N * colW + 16, H = headH + rows.length * rowH + 8;
  const X = (m) => labW + (m - 1) * colW; // left edge of month m
  const todayX = labW + (cm - 1 + (today().getUTCDate() - 1) / 31) * colW;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan of ${esc(p.acronym)}: baseline ${esc(v)} against forecast and actual" font-family="JetBrains Mono, monospace" font-size="${o.compact ? 9.5 : 10.5}">`;
  for (let m = 1; m <= N; m++) {
    const { m: mm, y } = mYM(p, m);
    if (mm === 1 || m === 1) s += `<text x="${X(m) + 2}" y="12" fill="var(--muted)">${y}</text>`;
    if (m === 1 || m % (o.compact ? 6 : 3) === 0) s += `<text x="${X(m) + colW / 2}" y="28" text-anchor="middle" fill="var(--muted)">M${m}</text>`;
    s += `<rect x="${X(m)}" y="${headH}" width="${colW}" height="${H - headH}" fill="${m % 2 ? 'var(--surface)' : 'var(--sunk)'}" opacity="${m % 2 ? 1 : .55}"/>`;
  }
  if (cm >= 1 && cm <= N) s += `<line x1="${todayX}" x2="${todayX}" y1="${headH - 6}" y2="${H}" stroke="var(--gold)" stroke-width="2"/><text x="${todayX + 3}" y="${headH - 8}" fill="var(--gold)" font-weight="600">today</text>`;
  rows.forEach((r, i) => {
    const y = headH + i * rowH, cy = y + rowH / 2, bh = o.compact ? 7 : 9;
    s += `<line x1="0" x2="${W}" y1="${y + rowH}" y2="${y + rowH}" stroke="var(--line)" stroke-width="0.6"/>`;
    const label = (txt, bold, tip) => `<text x="8" y="${cy + 3.5}" fill="var(--ink)" font-family="Public Sans, system-ui, sans-serif" font-size="${o.compact ? 11 : 12}" ${bold ? 'font-weight="600"' : ''}><title>${esc(tip || txt)}</title>${esc(txt.length > (o.compact ? 26 : 44) ? txt.slice(0, o.compact ? 25 : 43) + '…' : txt)}</text>`;
    if (r.kind === 'wp') {
      const w = r.x; s += label(`${w.code} ${w.title}`, true, `${w.code} ${w.title} · lead ${w.lead} · M${w.start}–M${w.end}`);
      s += `<rect x="${X(w.start)}" y="${cy - bh / 2 - 1}" width="${(w.end - w.start + 1) * colW}" height="${bh + 2}" rx="2" fill="var(--bar-base)"/>`;
    } else if (r.kind === 't') {
      const t = r.x; s += label(`  ${t.code} ${t.title || '[title to confirm]'}`, false, `${t.code} ${t.title || ''} · ${WPTSTATUS[t.status] || ''}${t.note ? ' · ' + t.note : ''}`);
      if (t.start != null && t.end != null) s += `<rect x="${X(t.start)}" y="${cy - bh / 2 - 3}" width="${(t.end - t.start + 1) * colW}" height="${bh / 2}" fill="var(--bar-plan-line)" opacity=".8"><title>Baseline M${t.start}–M${t.end}</title></rect>`;
      else if (t.end != null) s += `<rect x="${X(t.end)}" y="${cy - bh / 2 - 3}" width="${colW}" height="${bh / 2}" fill="var(--bar-plan-line)"><title>Baseline end M${t.end}</title></rect>`;
      const fs = t.forecast_start ?? t.start, fe = t.forecast_end ?? t.actual_end ?? t.end;
      if (fs != null && fe != null) { const col = t.status === 'done' ? 'var(--green)' : (fe > (t.end ?? fe) ? 'var(--red)' : 'var(--accent)'); s += `<rect x="${X(fs)}" y="${cy + 1}" width="${(fe - fs + 1) * colW}" height="${bh / 2 + 1}" fill="${col}"><title>${t.status === 'done' ? 'Actual' : 'Forecast'} M${fs}–M${fe}</title></rect>`; }
      const sl = (fe != null && t.end != null) ? fe - t.end : 0; if (sl > 0) s += `<text x="${X(fe + 1) + 3}" y="${cy + 4}" fill="var(--red)">+${sl} mo</text>`;
      if (t.status === 'done' && t.actual_end == null && t.end != null) s += `<text x="${X(t.end + 1) + 3}" y="${cy + 4}" fill="var(--muted)">done, month not recorded</text>`;
    } else {
      const x = r.x, due = dueM(p, x, v), isD = r.kind === 'd';
      const st = isD ? delState(p, x) : msState(p, x);
      const col = st.done ? 'var(--green)' : st.overdue ? 'var(--red)' : (isD ? (x.status === 'not_started' ? 'var(--muted)' : 'var(--accent)') : (x.status === 'at_risk' ? 'var(--amber)' : 'var(--muted)'));
      s += label(`  ${x.code} ${x.title}`, false, `${x.code} ${x.title} · due M${due}${isD ? ' · ' + (DSTATUS[x.status] || 'status not recorded') : ' · ' + (MSTATUS[x.status] || 'status not recorded')}${x.note ? ' · ' + x.note : ''}`);
      if (due == null) return;
      const cx = X(due) + colW - 3;
      const shape = (cx, fill, stroke, title) => isD ? `<path d="M${cx} ${cy - 6} L${cx + 6} ${cy} L${cx} ${cy + 6} L${cx - 6} ${cy} Z" fill="${fill}" stroke="${stroke}" stroke-width="1.5"><title>${esc(title)}</title></path>` : `<path d="M${cx} ${cy - 6} L${cx + 6} ${cy + 5} L${cx - 6} ${cy + 5} Z" fill="${fill}" stroke="${stroke}" stroke-width="1.5"><title>${esc(title)}</title></path>`;
      s += shape(cx, 'var(--surface)', 'var(--bar-plan-line)', `Baseline ${v}: M${due} (${mLabel(p, due)})`);
      const actual = isD ? null : x.achieved_month;
      const fm = actual ?? x.forecast_month;
      if (fm != null && fm !== due) { const fx = X(fm) + colW - 3; s += `<line x1="${cx}" x2="${fx}" y1="${cy}" y2="${cy}" stroke="${fm > due ? 'var(--red)' : 'var(--green)'}" stroke-dasharray="3 2"/>` + shape(fx, col, col, `${actual ? 'Achieved' : 'Forecast'} M${fm} (${mLabel(p, fm)})`); if (fm > due) s += `<text x="${fx + 9}" y="${cy + 4}" fill="var(--red)">+${fm - due} mo</text>`; }
      else s += shape(cx, col, col, `${st.done ? 'Done' : 'Due'} M${due}`);
    }
  });
  return `<div class="gantt">${s}</svg></div>`;
}
function renderPlan(p) {
  const v = baselineOf(p);
  return `<div class="toolbar"><span class="muted small">Baseline</span><div class="seg">${(p.baselines || []).map(b => `<button class="${b.v === v ? 'on' : ''}" data-act="baseline" data-pid="${esc(p.id)}" data-v="${esc(b.v)}" title="${esc(b.note || '')}">${esc(b.v)} · ${esc(b.label)}${b.date ? ' (' + fmtDay(b.date) + ')' : ''}</button>`).join('')}</div><span class="grow"></span><span class="small muted">${esc((p.baselines || []).find(b => b.v === v)?.note || '')}</span></div>
  <div class="legend"><span><i style="width:22px;height:5px;background:var(--bar-plan-line)"></i>Baseline</span><span><i style="width:22px;height:6px;background:var(--accent)"></i>Forecast</span><span><i style="width:22px;height:6px;background:var(--green)"></i>Done / actual</span><span><i style="width:22px;height:6px;background:var(--red)"></i>Slipped / overdue</span><span>◇ deliverable · △ milestone · hollow = baseline due month</span><span><i style="width:2px;height:12px;background:var(--gold)"></i>Today</span></div>
  ${gantt(p, {})}
  <p class="small muted">Months follow the GA: M1 = ${mLabel(p, 1)}. Hover a bar or marker for its months and status. Forecasts and statuses are edited in Deliverables & milestones.</p>`;
}

// ------------------------------------------------------------ deliverables & milestones
function renderDeliverables(p) {
  const ed = canEdit(), f = S.ui.dFilter;
  const ds = pDels(p.id).filter(d => !f || d.wp === f || d.status === f);
  const statusSel = (d) => ed ? `<select data-dfield="status" data-coll="deliverables" data-id="${esc(d.id)}" aria-label="Status of ${esc(d.code)}"><option value="" ${d.status == null ? 'selected' : ''}>Not recorded</option>${DSTATUS_ORDER.map(k => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${DSTATUS[k]}</option>`).join('')}</select>` : `<span class="status">${DSTATUS[d.status] || 'Not recorded'}</span>`;
  const row = (d) => { const st = delState(p, d), due = dueM(p, d), sl = slipOf(p, d); return `<tr>
    <td class="mono"><b>${esc(d.code)}</b>${confMark(p.id, d.code)}</td>
    <td style="min-width:200px">${esc(d.title)}${d.note ? `<div class="small muted">${esc(d.note)}</div>` : ''}</td>
    <td>${esc(d.lead || '[confirm]')}</td>
    <td class="mono" style="white-space:nowrap">M${due} · ${mLabel(p, due)}${st.overdue ? ' <span class="status late">overdue</span>' : ''}</td>
    <td>${statusSel(d)}</td>
    <td>${ed ? `<input type="number" min="1" max="${p.duration + 12}" style="width:68px" value="${d.forecast_month ?? ''}" data-dfield="forecast_month" data-coll="deliverables" data-id="${esc(d.id)}" aria-label="Forecast month of ${esc(d.code)}">` : (d.forecast_month ? 'M' + d.forecast_month : '')}${sl > 0 ? ` <span class="slip">+${sl} mo</span>` : ''}</td>
    <td>${ed ? `<input type="date" value="${esc(d.internal_deadline || '')}" data-dfield="internal_deadline" data-coll="deliverables" data-id="${esc(d.id)}" aria-label="Internal deadline of ${esc(d.code)}">` : fmtDay(d.internal_deadline)}</td>
    <td>${ed ? `<input type="text" style="width:120px" value="${esc(d.reviewer || '')}" placeholder="Reviewer" data-dfield="reviewer" data-coll="deliverables" data-id="${esc(d.id)}" aria-label="Reviewer of ${esc(d.code)}">` : esc(d.reviewer || '')}</td>
    <td>${d.vf_url ? `<a href="${esc(d.vf_url)}" target="_blank" rel="noopener">vf ↗</a>` : ''}${ed ? ` <button class="btn small" data-act="vf" data-id="${esc(d.id)}">${d.vf_url ? 'Change' : 'Add link'}</button>` : ''}</td>
    <td>${ed && d.status === 'submitted' || d.submitted_on ? (ed ? `<input type="date" value="${esc(d.submitted_on || '')}" data-dfield="submitted_on" data-coll="deliverables" data-id="${esc(d.id)}" aria-label="Submission date of ${esc(d.code)}">` : fmtDay(d.submitted_on)) : ''}</td>
  </tr>`; };
  const ms = pMss(p.id).filter(m => !f || m.wp === f);
  const mrow = (m) => { const st = msState(p, m), due = dueM(p, m); return `<tr>
    <td class="mono"><b>${esc(m.code)}</b></td><td style="min-width:200px">${esc(m.title)}${m.note ? `<div class="small muted">${esc(m.note)}</div>` : ''}</td><td>${esc(m.wp)}</td>
    <td class="mono" style="white-space:nowrap">M${due} · ${mLabel(p, due)}${st.overdue ? ' <span class="status late">overdue</span>' : ''}</td>
    <td>${ed ? `<select data-dfield="status" data-coll="milestones" data-id="${esc(m.id)}" aria-label="Status of ${esc(m.code)}"><option value="" ${m.status == null ? 'selected' : ''}>Not recorded</option>${Object.keys(MSTATUS).map(k => `<option value="${k}" ${m.status === k ? 'selected' : ''}>${MSTATUS[k]}</option>`).join('')}</select>` : `<span class="status">${MSTATUS[m.status] || 'Not recorded'}</span>`}</td>
    <td>${ed ? `<input type="number" min="1" style="width:68px" value="${(m.status === 'achieved' ? m.achieved_month : m.forecast_month) ?? ''}" data-dfield="${m.status === 'achieved' ? 'achieved_month' : 'forecast_month'}" data-coll="milestones" data-id="${esc(m.id)}" aria-label="${m.status === 'achieved' ? 'Month achieved' : 'Forecast month'} of ${esc(m.code)}">` : ''}<span class="small muted"> ${m.status === 'achieved' ? 'achieved' : 'forecast'}</span>${slipOf(p, m) > 0 ? ` <span class="slip">+${slipOf(p, m)} mo</span>` : ''}</td>
  </tr>`; };
  const wps = (p.wps || []).map(w => w.code);
  return `<div class="toolbar"><select id="d-filter" aria-label="Filter"><option value="">All work packages and statuses</option><optgroup label="Work package">${wps.map(w => `<option ${f === w ? 'selected' : ''}>${w}</option>`).join('')}</optgroup><optgroup label="Status">${DSTATUS_ORDER.map(k => `<option value="${k}" ${f === k ? 'selected' : ''}>${DSTATUS[k]}</option>`).join('')}</optgroup></select><span class="grow"></span><span class="small muted">Workflow: ${DSTATUS_ORDER.slice(0, 6).map(k => DSTATUS[k]).join(' → ')} / Revision requested</span></div>
  <div class="panel"><h3>Deliverables · ${ds.length}</h3><div class="tablewrap"><table><thead><tr><th>No.</th><th>Title</th><th>Lead</th><th>Due (${esc(baselineOf(p))})</th><th>Status</th><th>Forecast</th><th>Internal deadline</th><th>Reviewer</th><th>Final file</th><th>Submitted</th></tr></thead><tbody>${ds.map(row).join('') || '<tr><td colspan="10" class="empty">No deliverables match.</td></tr>'}</tbody></table></div></div>
  <div class="panel" style="margin-top:18px"><h3>Milestones · ${ms.length}</h3><div class="tablewrap"><table><thead><tr><th>No.</th><th>Title</th><th>WP</th><th>Due</th><th>Status</th><th>Month</th></tr></thead><tbody>${ms.map(mrow).join('')}</tbody></table></div></div>
  ${S.ui.vfFor ? '' : ''}`;
}

// ------------------------------------------------------------ work (tasks)
function ownerLabel(t) { return t.owner_kind === 'partner' ? (t.owner_partner || 'Partner, not set') : (t.owner_user ? nameOf(t.owner_user) : 'KMOP, unassigned'); }
function taskFilter(list) {
  const u = S.ui, q = u.wq.trim().toLowerCase();
  return list.filter(t => (u.wStatus === 'all' || (u.wStatus === 'open' ? t.status !== 'done' : t.status === u.wStatus))
    && (u.wOwner === 'all' || (u.wOwner === 'me' ? t.owner_user === S.myId : u.wOwner === 'kmop' ? t.owner_kind === 'kmop' : t.owner_kind === 'partner'))
    && (!u.wWp || t.wp === u.wWp) && (!q || (t.title + ' ' + (t.owner_partner || '') + ' ' + (t.deliverable || '')).toLowerCase().includes(q)));
}
const sortTasks = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || a.title.localeCompare(b.title);
function taskStatusPill(t) { const late = taskOverdue(t); return `<span class="status ${t.status === 'done' ? 'done' : t.status === 'doing' ? 'doing' : t.status === 'blocked' ? 'blocked' : ''}">${TSTATUS[t.status]}</span>${late ? ' <span class="status late">overdue</span>' : ''}`; }
function renderWork(p) {
  const u = S.ui, all = pTasks(p.id), list = taskFilter(all).sort(sortTasks), ed = canEdit();
  const tools = `<div class="toolbar"><div class="seg">${[['list','List'],['board','Board'],['calendar','Calendar']].map(([k, l]) => `<button class="${u.work === k ? 'on' : ''}" data-act="wview" data-v="${k}">${l}</button>`).join('')}</div>
    <select id="w-owner" aria-label="Owner"><option value="all" ${u.wOwner === 'all' ? 'selected' : ''}>Everyone</option><option value="me" ${u.wOwner === 'me' ? 'selected' : ''}>Mine</option><option value="kmop" ${u.wOwner === 'kmop' ? 'selected' : ''}>KMOP</option><option value="partner" ${u.wOwner === 'partner' ? 'selected' : ''}>Partners</option></select>
    ${u.work !== 'board' ? `<select id="w-status" aria-label="Status"><option value="open" ${u.wStatus === 'open' ? 'selected' : ''}>Open</option>${Object.keys(TSTATUS).map(k => `<option value="${k}" ${u.wStatus === k ? 'selected' : ''}>${TSTATUS[k]}</option>`).join('')}<option value="all" ${u.wStatus === 'all' ? 'selected' : ''}>All</option></select>` : ''}
    <select id="w-wp" aria-label="Work package"><option value="">All WPs</option>${(p.wps || []).map(w => `<option ${u.wWp === w.code ? 'selected' : ''}>${w.code}</option>`).join('')}</select>
    <input type="search" id="w-q" placeholder="Filter tasks" value="${esc(u.wq)}" aria-label="Filter tasks"><span class="grow"></span>
    ${ed ? `<form id="newtask" class="row"><input type="text" id="nt-title" placeholder="New task title" aria-label="New task title" style="min-width:220px"><button class="btn primary" type="submit">Add task</button></form>` : ''}</div>`;
  let body;
  if (u.work === 'board') {

function renderCalendar(list) {

async function confirmReview() {

    const pUpd = {};

          await S.db.collection(coll).doc(`${p.id}__${x.code}`).set({ project: p.id, code: x.code, title: x.title || null, wp: x.wp || null, lead: x.lead || null, type: x.type || null, diss: x.diss || null, verification: x.verification || null, due: { [v]: x.due_month ?? null }, status: coll === 'deliverables' ? 'not_started' : 'planned', forecast_month: null, note: null, source: src, baseline_cite: x.cite || null });

        if (isNew) pUpd.wps_by_baseline = { ...(p.wps_by_baseline || {}), [curV]: p.wps || [] };
      } else if (r.key === 'partners') {
        const fresh = (d.partners || []).map(x => ({ short: x.short || x.name, name: x.name || x.short, country: x.country || null, role: x.role || null, pic: x.pic || null }));
        if (isNew) {
          const allV = (p.baselines || []).map(b => b.v);
          const merged = (p.partners || []).map(x => { const base = { ...x, baselines: x.baselines || allV }; const m = fresh.find(f => norm(f.short) === norm(x.short) || norm(f.name) === norm(x.name)); return m ? { ...base, ...m, baselines: [...new Set([...base.baselines, v])] } : base; });

      else if (r.key === 'risks') { for (const rk of d.risks || []) await S.db.collection('risks').add({ project: p.id, description: rk.description, likelihood: rk.likelihood || null, impact: rk.impact || null, mitigation: rk.mitigation || null, owner: null, status: 'open', source: src, cite: rk.cite || null, created_at: nowIso(), created_by: S.myId }); }

// ---------------- data-conflict detector (computed on every sync, never resolved silently)
function computedConflicts(p) {
  const out = [];
  for (const s of openSugg(p.id).filter(s => s.kind === 'status_change')) {
    const code = norm(s.target || s.deliverable), d = pDels(p.id).find(y => norm(y.code) === code), m = pMss(p.id).find(y => norm(y.code) === code);
    const x = d || m; if (!x) continue;
    const curSt = d ? (DSTATUS[d.status] || 'Not recorded') : (MSTATUS[m.status] || 'Not recorded');
    const newSt = DSTATUS[s.new_status] || TSTATUS[s.new_status] || MSTATUS[s.new_status] || s.new_status;
    if (norm(curSt) === norm(newSt) || (d && d.status === s.new_status)) continue;
    out.push({ key: `cc:sugg:${s.id}`, object: x.code, field: 'Status', reason: `The minutes say ${x.code} is “${newSt}”; Co-Work says “${curSt}”.`, entries: [{ source: `Minutes (${s.cite?.file_title || 'meeting'})`, rank: 3, value: newSt, url: s.cite?.url || null }, { source: 'Co-Work record', rank: 5, value: curSt }], sugg: s.id });
  }
  for (const d of draftsFor(p.id).filter(d => d.status === 'draft')) {
    const n = diffDraft(p, d).filter(r => r.state === 'changed').length;
    if (n) out.push({ key: `cc:draft:${d.id}`, object: 'Baseline', field: `${n} values`, reason: `${d.baseline_label || 'The grant documents'} differ from Co-Work in ${n} places. The GA prevails once you confirm.`, entries: [{ source: d.baseline_label || 'Grant documents', rank: 1, value: `${n} differences` }, { source: 'Co-Work record', rank: 5, value: 'current baseline' }], draft: d.id });
  }
  for (const d of pDels(p.id).filter(d => DDONE.has(d.status))) {
    const open = pTasks(p.id).filter(t => t.deliverable === d.code && t.status !== 'done');
    if (open.length) out.push({ key: `cc:open:${d.code}`, object: d.code, field: 'Open tasks', reason: `${d.code} is “${DSTATUS[d.status]}” but ${open.length} task${open.length > 1 ? 's' : ''} for it ${open.length > 1 ? 'are' : 'is'} still open.`, entries: [{ source: 'Deliverable status', rank: 5, value: DSTATUS[d.status] }, { source: 'Tasks', rank: 5, value: `${open.length} open` }], task: open[0].id });
  }
  return out;
}
const RANK = { 1: 'Grant Agreement / Annex 1', 2: 'Project Work Plan', 3: 'Minutes', 4: 'Group emails', 5: 'Manual input' };
function renderConflicts(p) {
  const stored = pConf(p.id), computed = computedConflicts(p);
  if (!stored.length && !computed.length) return '';

    ${S3.resolving === c.id ? `<div class="row" style="margin-top:6px"><input type="text" id="cres-note" placeholder="Why (optional)" style="flex:1"><button class="btn small primary" data-act="cres-save" data-id="${esc(c.id)}">Keep the selected value</button><button class="btn small" data-act="cres-cancel">Cancel</button></div>` : ''}</div>

// ---------------- status writer
function statusContext(p) {
  const v = baselineOf(p), cm = curM(p), rg = ragOf(p), weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
  const L = [];
  L.push(`Project ${p.acronym}: ${p.title}. ${p.programme} ${p.call}. KMOP ${p.entity} is ${p.role}${(p.wp_leads || []).length ? ', leads ' + p.wp_leads.join(', ') : ''}. Lump sum: ${p.funding_model === 'lump_sum' ? 'yes' : 'no'}.`);
  L.push(`Today ${iso(today())} = M${cm} of ${p.duration} (M1 = ${mLabel(p, 1)}). Baseline ${v}.`);
  L.push(`RAG by the rules: ${rg.computed.toUpperCase()}. Reasons: ${(rg.reasons || []).join('; ') || 'none'}.${rg.override ? ` PM override: ${rg.override.rag} (${rg.override.reason}).` : ''}`);
  L.push('Deliverables (code | title | lead | due month | status | forecast):');
  for (const d of pDels(p.id)) L.push(`- ${d.code} | ${d.title} | ${d.lead || '?'} | M${dueM(p, d)} (${mLabel(p, dueM(p, d))}) | ${DSTATUS[d.status] || 'not recorded'}${d.forecast_month ? ' | forecast M' + d.forecast_month : ''}`);
  L.push('Milestones:'); for (const m of pMss(p.id)) L.push(`- ${m.code} ${m.title} | due M${dueM(p, m)} | ${MSTATUS[m.status] || 'not recorded'}${m.achieved_month ? ' (M' + m.achieved_month + ')' : ''}`);
  const open = pTasks(p.id).filter(t => t.status !== 'done');
  L.push(`Open tasks (${open.length}):`); for (const t of open.slice(0, 40)) L.push(`- ${t.title} | ${ownerLabel(t)} | ${t.due || 'no date'} | ${TSTATUS[t.status]}${t.coordinator_blocker ? ' | COORDINATOR ITEM since ' + (t.since || '?') : ''}${taskOverdue(t) ? ' | OVERDUE' : ''}`);
  const done = pTasks(p.id).filter(t => t.status === 'done' && (t.updated_at || '') >= weekAgo); if (done.length) { L.push('Tasks completed in the last 7 days:'); for (const t of done) L.push('- ' + t.title); }
  const act = S.activity.filter(a => a.project === p.id && (a.at || '') >= weekAgo); if (act.length) { L.push('Changes in the last 7 days:'); for (const a of act.slice(0, 40)) L.push(`- ${a.at.slice(0, 10)} ${a.text}`); }
  const conf = [...pConf(p.id), ...computedConflicts(p)]; if (conf.length) { L.push('Open conflicts between sources:'); for (const c of conf) L.push(`- ${c.object} ${c.field}: ${c.reason}`); }
  const rs = S.risks.filter(r => r.project === p.id && r.status !== 'closed'); if (rs.length) { L.push('Risks:'); for (const r of rs.slice(0, 12)) L.push('- ' + r.description); }
  const ms = S.meetings.filter(m => m.project === p.id).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 3); if (ms.length) { L.push('Recent meetings:'); for (const m of ms) L.push(`- ${m.date || '?'} ${m.title}`); }
  const prev = latestStatus(p.id, 'published'); if (prev) L.push(`Last published status (${(prev.published_at || prev.generated_at || '').slice(0, 10)}): ${prev.summary}`);
  return L.join('\n');
}
async function runStatus(p) {

  try {
    await runRef.set({ agent: 'status', project: p.id, by: S.myId, at: nowIso(), status: 'running' });
    const prompt = `You are the Status writer of KMOP Co-Work. Write this week's status of the EU project below for KMOP's PM and senior management.
Rules: use only the record below; do not invent facts or dates; name deliverables by code; plain English, no jargon; say "not recorded" where the record is silent.
Reply with ONLY one JSON object: {"summary": "5 to 8 sentences: where the project is, what changed since last week, what is at risk", "rag_proposal": "green"|"amber"|"red", "rag_reasons": ["short reason", ...], "changes": ["what changed since last week", ...], "urgent": ["what needs action in the next 14 days, with owner when known", ...]}

${statusContext(p)}`;
    const out = await S2.sample.json(prompt, { modelTier: 'default', cache: false, onText: ({ text }) => { run.msg = `Writing… (${text.length} characters)`; scheduleRender(); } });

    await runRef.update({ status: 'done', finished_at: nowIso() });

  } catch (e) { run.busy = false; run.msg = sampleErrorText(e); runRef.update({ status: 'failed', finished_at: nowIso(), error: String(e?.code || 'error') }).catch(() => {}); }

}

// ---------------- notifications (in-app; email digests stay off until KMOP approves sending)
function notifications() {
  const out = [], mine = myProjectIds(), role = myRole(), t0 = today();
  const add = (n) => out.push(n);
  for (const t of S.tasks) {
    if (t.status === 'done' || !(t.owner_user === S.myId || (t.watchers || []).includes(S.myId))) continue;
    if (!t.due) continue;
    const d = daysBetween(t0, parseDay(t.due));
    if (d < 0) add({ key: `n:task:${t.id}:late:${t.due}`, sev: 'red', t: `Overdue: ${t.title}`, s: `${proj(t.project)?.acronym || ''} · was due ${fmtDay(t.due)}`, project: t.project, task: t.id });
    else if (d <= 1) add({ key: `n:task:${t.id}:1:${t.due}`, sev: 'amber', t: `Due ${d === 0 ? 'today' : 'tomorrow'}: ${t.title}`, s: proj(t.project)?.acronym || '', project: t.project, task: t.id });
    else if (d <= 7) add({ key: `n:task:${t.id}:7:${t.due}`, sev: 'blue', t: `Due this week: ${t.title}`, s: `${proj(t.project)?.acronym || ''} · ${fmtDay(t.due)}`, project: t.project, task: t.id });
  }
  for (const p of S.projects) {
    const involved = mine.has(p.id) || role === 'admin';
    if (involved) {
      for (const d of pDels(p.id)) {
        const st = delState(p, d); if (st.done || st.days == null || st.days < 0) continue;
        const bucket = [1, 7, 14, 30].find(b => st.days <= b); if (!bucket) continue;
        const ours = isKmop(d.lead) || p.role === 'COORDINATOR';
        if (!ours) continue;
        add({ key: `n:del:${d.id}:${bucket}:${dueM(p, d)}`, sev: bucket <= 7 ? 'red' : bucket <= 14 ? 'amber' : 'blue', t: `${p.acronym} ${d.code} due in ${st.days} days`, s: `${d.title} · ${DSTATUS[d.status] || 'status not recorded'}${!isKmop(d.lead) && p.role === 'COORDINATOR' ? ` · lead ${d.lead}: draft a reminder` : ''}`, project: p.id, tab: 'deliverables', remind: !isKmop(d.lead) && p.role === 'COORDINATOR' ? d.id : null });
      }
      for (const a of meetingAlerts(p)) add({ ...a, key: 'n:' + a.key, t: `${p.acronym}: ${a.t}`, project: p.id, tab: 'meetings' });
      const newS = openSugg(p.id).filter(s => (s.created_at || '') > (prefs().suggSeen?.[p.id] || ''));
      if (newS.length) add({ key: `n:sugg:${p.id}:${newS.length}:${newS[newS.length - 1].created_at}`, sev: 'blue', t: `${newS.length} new agent suggestions in ${p.acronym}`, s: 'Accept, edit or reject them', project: p.id, tab: 'meetings' });
      const dr = latestStatus(p.id, 'draft'), pub = latestStatus(p.id, 'published');
      if (dr && (!pub || dr.generated_at > (pub.published_at || pub.generated_at))) add({ key: `n:status:${dr.id}`, sev: 'blue', t: `Status summary draft for ${p.acronym}`, s: 'Review and publish it', project: p.id, tab: 'overview' });

    ${(x.deadlines || []).length ? `<div class="small"><b>Deadlines</b><ul class="list">${x.deadlines.map(r => `<li>${esc(r.what)}${r.date ? ` · <span class="mono">${fmtDay(r.date)}</span>` : ''}${r.owner ? ` · ${esc(r.owner)}` : ''}</li>`).join('')}</ul></div>` : ''}
    ${(x.decisions || []).length ? `<div class="small"><b>Decisions</b><ul class="list">${x.decisions.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}
    ${(x.attachments || []).length ? `<div class="small"><b>Attachments to file</b><ul class="list">${x.attachments.map(a => `<li>${esc(a.name)}${a.suggest_folder ? ` → ${esc(a.suggest_folder)}` : ''}</li>`).join('')}</ul></div>` : ''}
  </div>`;
}
function renderInbox(p) {
  const es = S.emails.filter(e => e.project === p.id).sort((a, b) => (b.last_date || '').localeCompare(a.last_date || ''));
  const sg = openSugg(p.id).filter(s => s.agent === 'email');
  const reqs = es.flatMap(e => (e.extract?.requests_to_kmop || []).map(r => ({ ...r, e }))).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  const ed = canEdit();
  return `<div class="toolbar"><span class="small muted">Group address: <b class="mono">${esc(groupOf(p) || 'not set')}</b>${S.isAdmin ? ` <button class="btn small" data-act="grp-edit" data-pid="${esc(p.id)}">Change</button>` : ''} · Emails are matched by this address, then by “${esc(p.acronym)}” in the subject.</span><span class="grow"></span>${mailSettings().last_sync_at ? `<span class="small muted">Last sync ${esc(mailSettings().last_sync_at.slice(0, 16).replace('T', ' '))}</span>` : ''}<button class="btn small" data-act="nav" data-view="mailbox">Mailbox</button></div>
  ${S4.grpFor === p.id ? `<form id="grp-form" data-pid="${esc(p.id)}" class="row" style="margin-bottom:12px"><input type="text" id="grp-addr" value="${esc(groupOf(p) || '')}" placeholder="project-group@kmop.org" style="flex:1"><button class="btn small primary" type="submit">Save</button></form>` : ''}
  <div class="grid2"><div class="stack">${es.length ? es.map(e => renderEmail(e)).join('') : '<div class="empty">No emails for this project yet. They arrive when the mailbox is synced (Mailbox page).</div>'}</div>
  <div class="stack"><div class="panel"><h3>Requests to KMOP · ${reqs.length}</h3>${reqs.length ? reqs.map(r => `<div class="kpi"><div class="small">${esc(r.what)}<div class="muted">${esc(r.from_org || '')} · ${esc(r.e.subject)}</div></div><div class="mono small" style="${r.due && parseDay(r.due) < today() ? 'color:var(--red)' : ''}">${r.due ? fmtDay(r.due) : ''}</div></div>`).join('') : '<div class="empty small">None found.</div>'}</div>
  <div class="panel"><h3>Suggestions from emails · ${sg.length}</h3>${sg.length ? `<div class="urgent">${sg.map(renderSuggestion).join('')}</div>` : '<div class="empty small">No open suggestions from emails.</div>'}</div></div></div>`;
}
function renderMailbox() {
  const st = S4.sync, ms = mailSettings(), un = S.emails.filter(e => !e.project && !e.ignored).sort((a, b) => (b.last_date || '').localeCompare(a.last_date || ''));
  const counts = S.projects.map(p => [p, S.emails.filter(e => e.project === p.id).length]);
  return `<div class="phead"><h1>Mailbox</h1><div class="muted">Consortium group emails received at <b>system@kmop.org</b>. Co-Work keeps the extracted facts and a link to each thread, not the email text.</div></div>
  <div class="grid2"><div class="stack"><div class="panel"><h3>Sync</h3>
    <p class="small">Sync reads the Gmail account connected to <i>your</i> Claude, so run it while signed in to the Gmail connector as <b>system@kmop.org</b>. It looks for mail to or from each project's group address, or with the acronym in the subject, since the last sync. Each new or updated thread goes to the Email triage agent.</p>
    <div class="small muted" style="margin-bottom:8px">${ms.last_sync_at ? `Last sync ${esc(ms.last_sync_at.slice(0, 16).replace('T', ' '))} by ${esc(ms.last_sync_by === 'session' ? 'Claude (setup run)' : nameOf(ms.last_sync_by))}${ms.account ? ` · mailbox ${esc(ms.account)}` : ''}` : 'Never synced.'}</div>
    ${st ? `<div class="notice small" style="margin-bottom:8px">${esc(st.msg)}</div>` : ''}
    ${canEdit() ? `<button class="btn primary" data-act="mail-sync" ${st?.busy || !S2.mcp || !S2.sample ? 'disabled' : ''}>Sync now</button>${!S2.mcp ? '<p class="small muted">Gmail is not available in this view.</p>' : ''}` : ''}</div>
    <div class="panel"><h3>By project</h3>${counts.map(([p, n]) => `<div class="kpi"><div><b>${esc(p.acronym)}</b> <span class="small muted mono">${esc(groupOf(p) || 'no group address')}</span></div><button class="btn small" data-act="open-tab" data-id="${esc(p.id)}" data-tab="inbox">${n} threads</button></div>`).join('')}</div></div>
  <div class="stack"><div class="panel"><h3>Not matched to a project · ${un.length}</h3>${un.length ? un.map(e => `<div class="kpi"><div class="small"><b>${esc(e.subject)}</b><div class="muted">${esc((e.last_date || '').slice(0, 10))} · ${esc((e.from_orgs || []).join(', '))}${e.view_url ? ` · <a href="${esc(e.view_url)}" target="_blank" rel="noopener">Gmail ↗</a>` : ''}</div>${e.extract?.summary ? `<div>${esc(e.extract.summary)}</div>` : ''}</div>${canEdit() ? `<select data-assign="${esc(e.id)}" aria-label="Assign to project"><option value="">Assign to…</option>${S.projects.map(p => `<option value="${esc(p.id)}">${esc(p.acronym)}</option>`).join('')}<option value="__ignore">Not project mail</option></select>` : ''}</div>`).join('') : '<div class="empty small">Every synced thread was matched to a project.</div>'}</div></div></div>`;
}

// pins: kept per person in their private subtree (falls back to this browser)
async function togglePin(id) {
  const set = new Set(S.pins); set.has(id) ? set.delete(id) : set.add(id); S.pins = [...set]; render();
  try { localStorage.setItem('cowork-pins', JSON.stringify(S.pins)); } catch {}
  savePrefs({ pins: S.pins });
}

// ============================================================ boot
(async function boot() {
  try { S.pins = JSON.parse(localStorage.getItem('cowork-pins') || '[]'); } catch {}
  render();
  if (!window.claude?.use) { S.noDb = true; render(); return; }
  const [db, user, mcp, sample] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('mcp'), window.claude.use('sample')]);
  S2.mcp = mcp; S2.sample = sample;
  S.user = user;
  if (user) {
    try {
      const [me, myId, can, edit, owner] = await Promise.all([user.me(), user.id(), user.can('data.write'), user.canEdit(), user.isOwner()]);
      S.me = me; S.myId = myId; S.canWrite = can !== false; S.isAdmin = !!edit; S.isOwner = !!owner;
      if (myId && me?.name) S.names[myId] = me.name;
    } catch {}
  }
  if (!db) { S.noDb = true; render(); return; }
  S.db = db;
  sub('projects', 'projects', q => q.orderBy('acronym'));
  sub('deliverables', 'dels'); sub('milestones', 'mss'); sub('tasks', 'tasks'); sub('conflicts', 'conflicts');
  sub('handled', 'handled'); sub('overrides', 'overrides'); sub('kpi_values', 'kpiv'); sub('members', 'members');
  sub('activity', 'activity', q => q.orderBy('at', 'desc').limit(300));
  sub('drafts', 'drafts'); sub('suggestions', 'sugg'); sub('meetings', 'meetings'); sub('risks', 'risks'); sub('agent_runs', 'runs', q => q.orderBy('at', 'desc').limit(200));
  if (S.myId) db.doc(`data/users/${S.myId}/prefs`).onSnapshot(s => { if (s.exists) { S.prefs = { ...s.data() }; if (Array.isArray(S.prefs.pins)) S.pins = S.prefs.pins; scheduleRender(); } }, () => {});
  sub('status_reports', 'statusReports'); sub('emails', 'emails'); sub('settings', 'settings');
})();
</script>
