<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>KMOP HQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d5bd8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='15' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('kmop.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app"><div class="loading-page"><span class="spinner" aria-label="Loading"></span></div></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
